<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <title>Calorie Calculator</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta name="theme-color" content="#111827"/>
  <link rel="manifest" href="manifest.webmanifest"/>

  <style>
      :root {
          font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
          color-scheme: light dark;
          --bg: #0f172a;
          --card-bg: #111827;
          --text: #e5e7eb;
          --accent: #3b82f6;
          --accent-soft: rgba(59, 130, 246, 0.15);
          --border: #1f2937;
          --danger: #f97373;
      }

      * {
          box-sizing: border-box;
      }

      body {
          margin: 0;
          min-height: 100vh;
          display: flex;
          align-items: center;
          justify-content: center;
          background: radial-gradient(circle at top, #1f2937 0, #020617 55%);
          color: var(--text);
          padding: 16px;
      }

      .app {
          width: 100%;
          max-width: 420px;
          background: linear-gradient(145deg, #020617, #020617);
          border-radius: 20px;
          padding: 20px 18px 18px;
          border: 1px solid var(--border);
          box-shadow: 0 18px 40px rgba(0, 0, 0, 0.75),
          0 0 0 1px rgba(15, 23, 42, 0.8);
      }

      .header {
          display: flex;
          align-items: center;
          justify-content: space-between;
          margin-bottom: 18px;
      }

      .title {
          font-size: 1.1rem;
          font-weight: 600;
      }

      .subtitle {
          font-size: 0.8rem;
          color: #9ca3af;
      }

      .chip {
          font-size: 0.7rem;
          padding: 4px 8px;
          border-radius: 999px;
          border: 1px solid rgba(148, 163, 184, 0.4);
          color: #e5e7eb;
          text-transform: uppercase;
          letter-spacing: 0.06em;
      }

      form {
          display: grid;
          gap: 10px;
          margin-bottom: 14px;
      }

      label {
          font-size: 0.8rem;
          margin-bottom: 4px;
          display: block;
          color: #9ca3af;
      }

      .field {
          display: flex;
          flex-direction: column;
          gap: 4px;
          background: radial-gradient(circle at top left, #111827 0, #020617 55%);
          border-radius: 12px;
          padding: 8px 10px;
          border: 1px solid rgba(31, 41, 55, 0.9);
      }

      .field-row {
          display: flex;
          gap: 8px;
      }

      .field-row > .field {
          flex: 1;
      }

      input[type="number"], select {
          width: 100%;
          padding: 7px 8px;
          font-size: 0.85rem;
          border-radius: 8px;
          border: 1px solid rgba(55, 65, 81, 0.9);
          background: rgba(15, 23, 42, 0.85);
          color: #e5e7eb;
          outline: none;
      }

      input[type="number"]:focus, select:focus {
          border-color: var(--accent);
          box-shadow: 0 0 0 1px rgba(37, 99, 235, 0.5);
      }

      .hint {
          font-size: 0.7rem;
          color: #6b7280;
      }

      button {
          margin-top: 6px;
          width: 100%;
          padding: 9px 12px;
          border-radius: 999px;
          border: none;
          font-weight: 600;
          font-size: 0.9rem;
          cursor: pointer;
          background: radial-gradient(circle at 10% 0, #2563eb 0, #0ea5e9 32%, #22c55e 90%);
          color: white;
          box-shadow: 0 12px 20px rgba(37, 99, 235, 0.35),
          0 0 0 1px rgba(8, 47, 73, 0.8);
      }

      button:active {
          transform: translateY(1px);
          box-shadow: 0 6px 15px rgba(37, 99, 235, 0.45),
          0 0 0 1px rgba(8, 47, 73, 0.8);
      }

      .result-card {
          margin-top: 8px;
          border-radius: 14px;
          padding: 10px 11px;
          background: radial-gradient(circle at top right, rgba(59, 130, 246, 0.15) 0, #020617 60%);
          border: 1px solid rgba(37, 99, 235, 0.4);
          font-size: 0.85rem;
      }

      .result-main {
          display: flex;
          justify-content: space-between;
          align-items: baseline;
          margin-bottom: 6px;
          gap: 12px;
      }

      .result-main-title {
          font-size: 0.8rem;
          text-transform: uppercase;
          letter-spacing: 0.08em;
          color: #9ca3af;
      }

      .result-main-value {
          font-size: 1.2rem;
          font-weight: 700;
      }

      .result-tagline {
          font-size: 0.75rem;
          color: #9ca3af;
          margin-bottom: 5px;
      }

      .result-grid {
          display: grid;
          grid-template-columns: repeat(3, minmax(0, 1fr));
          gap: 6px;
          font-size: 0.75rem;
      }

      .result-pill {
          padding: 5px 7px;
          border-radius: 10px;
          background: rgba(15, 23, 42, 0.85);
          border: 1px solid rgba(55, 65, 81, 0.9);
      }

      .result-pill-label {
          font-size: 0.7rem;
          color: #9ca3af;
      }

      .result-pill-value {
          font-weight: 600;
      }

      .error {
          margin-top: 6px;
          font-size: 0.75rem;
          color: var(--danger);
      }
  </style>
</head>
<body>
<main class="app">
  <header class="header">
    <div>
      <div class="title">Daily Calorie Calculator</div>
      <div class="subtitle">Mifflin–St Jeor · metric units</div>
    </div>
    <div class="chip">Offline PWA</div>
  </header>

  <button id="installBtn" style="display:none; margin-bottom:10px;">
    Install app
  </button>

  <form id="calorie-form" novalidate>
    <div class="field-row">
      <div class="field">
        <label for="age">Age</label>
        <input id="age" type="number" min="10" max="100" required placeholder="28"/>
      </div>

      <div class="field">
        <label for="sex">Sex</label>
        <select id="sex">
          <option value="male">Male</option>
          <option value="female">Female</option>
        </select>
      </div>
    </div>

    <div class="field-row">
      <div class="field">
        <label for="weight">Weight (kg)</label>
        <input id="weight" type="number" min="30" max="250" step="0.1" required placeholder="75"/>
        <div class="hint">Use kg (lbs ÷ 2.205)</div>
      </div>

      <div class="field">
        <label for="height">Height (cm)</label>
        <input id="height" type="number" min="130" max="230" step="0.5" required placeholder="180"/>
        <div class="hint">Use cm (in × 2.54)</div>
      </div>
    </div>

    <div class="field">
      <label for="activity">Activity level</label>
      <select id="activity">
        <option value="1.2">Sedentary (office, little exercise)</option>
        <option value="1.375">Light (1–3 workouts/week)</option>
        <option value="1.55">Moderate (3–5 workouts/week)</option>
        <option value="1.725">Very active (hard exercise)</option>
        <option value="1.9">Athlete / physical job</option>
      </select>
      <div class="hint">Used to estimate maintenance calories</div>
    </div>

    <div class="field">
      <label for="goal">Goal</label>
      <select id="goal">
        <option value="maintain">Maintain weight</option>
        <option value="loss-10">Lose ~0.25 kg/week (~10% deficit)</option>
        <option value="loss-20">Lose ~0.5 kg/week (~20% deficit)</option>
        <option value="gain-10">Gain slowly (~10% surplus)</option>
        <option value="gain-15">Gain more aggressively (~15% surplus)</option>
      </select>
    </div>

    <button type="submit">Calculate</button>
    <div id="error" class="error" style="display:none;"></div>
  </form>

  <section id="results" class="result-card" style="display:none;">
    <div class="result-main">
      <div>
        <div class="result-main-title">Daily target</div>
        <div class="result-main-value"><span id="target"></span> kcal</div>
      </div>
      <div>
        <div class="result-main-title">Maintenance</div>
        <div class="result-main-value" style="font-size:1rem;"><span id="maintenance"></span></div>
      </div>
    </div>

    <div class="result-tagline" id="goal-text"></div>

    <div class="result-grid">
      <div class="result-pill">
        <div class="result-pill-label">Protein (~1.6 g/kg)</div>
        <div class="result-pill-value"><span id="protein-grams"></span> g</div>
      </div>
      <div class="result-pill">
        <div class="result-pill-label">Carbs (~45% kcal)</div>
        <div class="result-pill-value"><span id="carbs-grams"></span> g</div>
      </div>
      <div class="result-pill">
        <div class="result-pill-label">Fat (~30% kcal)</div>
        <div class="result-pill-value"><span id="fat-grams"></span> g</div>
      </div>
    </div>
  </section>
</main>

<script>
  function round(val) {
    return Math.round(val);
  }

  function calcBmr({sex, weightKg, heightCm, age}) {
    if (sex === 'male') {
      return 10 * weightKg + 6.25 * heightCm - 5 * age + 5;
    }
    return 10 * weightKg + 6.25 * heightCm - 5 * age - 161;
  }

  function goalAdjustFactor(goal) {
    switch (goal) {
      case 'loss-10':
        return 0.9;
      case 'loss-20':
        return 0.8;
      case 'gain-10':
        return 1.1;
      case 'gain-15':
        return 1.15;
      default:
        return 1.0; // maintain
    }
  }

  function goalDescription(goal) {
    switch (goal) {
      case 'loss-10':
        return 'Mild fat loss (~10% deficit). Easier to stick to.';
      case 'loss-20':
        return 'Faster fat loss (~20% deficit). Harder but quicker.';
      case 'gain-10':
        return 'Slow lean gain (~10% surplus).';
      case 'gain-15':
        return 'More aggressive gain (~15% surplus).';
      default:
        return 'Calories to roughly maintain your current weight.';
    }
  }

  document.getElementById('calorie-form').addEventListener('submit', function (e) {
    e.preventDefault();

    const age = Number(document.getElementById('age').value);
    const sex = document.getElementById('sex').value;
    const weightKg = Number(document.getElementById('weight').value);
    const heightCm = Number(document.getElementById('height').value);
    const activityFactor = Number(document.getElementById('activity').value);
    const goal = document.getElementById('goal').value;

    const errorEl = document.getElementById('error');
    const resultsEl = document.getElementById('results');

    // basic validation
    if (!age || !weightKg || !heightCm) {
      errorEl.textContent = 'Please fill in age, weight, and height.';
      errorEl.style.display = 'block';
      resultsEl.style.display = 'none';
      return;
    }

    if (age < 10 || age > 100 || weightKg < 30 || weightKg > 250 || heightCm < 130 || heightCm > 230) {
      errorEl.textContent = 'Inputs look unrealistic. Check age, weight, and height.';
      errorEl.style.display = 'block';
      resultsEl.style.display = 'none';
      return;
    }

    errorEl.style.display = 'none';

    const bmr = calcBmr({sex, weightKg, heightCm, age});
    const maintenance = bmr * activityFactor;
    const target = maintenance * goalAdjustFactor(goal);

    // Macros from target calories:
    // - protein: ~1.6 g/kg
    // - carbs: 45% of kcal (4 kcal/g)
    // - fat: 30% of kcal (9 kcal/g)
    const proteinGrams = 1.6 * weightKg;
    const carbsGrams = (target * 0.45) / 4;
    const fatGrams = (target * 0.30) / 9;

    document.getElementById('maintenance').textContent = round(maintenance);
    document.getElementById('target').textContent = round(target);
    document.getElementById('protein-grams').textContent = round(proteinGrams);
    document.getElementById('carbs-grams').textContent = round(carbsGrams);
    document.getElementById('fat-grams').textContent = round(fatGrams);
    document.getElementById('goal-text').textContent = goalDescription(goal);

    resultsEl.style.display = 'block';
  });

  // Register service worker
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('./sw.js').catch(function (err) {
        console.error('SW registration failed:', err);
      });
    });
  }
  let deferredPrompt;

  window.addEventListener('beforeinstallprompt', (e) => {
    // Prevent the mini-infobar
    e.preventDefault();
    deferredPrompt = e;

    const btn = document.getElementById('installBtn');
    if (btn) {
      btn.style.display = 'block';
    }
  });

  const installBtn = document.getElementById('installBtn');
  if (installBtn) {
    installBtn.addEventListener('click', async () => {
      if (!deferredPrompt) return;

      deferredPrompt.prompt();
      const choice = await deferredPrompt.userChoice;

      // After user responds, clear the saved event
      deferredPrompt = null;

      if (choice.outcome === 'accepted') {
        installBtn.style.display = 'none';
      }
    });
  }

  window.addEventListener('appinstalled', () => {
    const btn = document.getElementById('installBtn');
    if (btn) {
      btn.style.display = 'none';
    }
  });
</script>
</body>
</html>
